<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHANEL Perfume</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

</head>
<body>
  <main class="product-card">
    <picture class="product-img">
      <source media="(max-width: 600px)" srcset="image-product-mobile.jpg">
      <img src="image-product-desktop.jpg" alt="Gabrielle Essence Eau De Parfum bottle on a table" class="image-desktop">
    </picture>

    <div class="product-content">
      <p class="category">P E R F U M E</p>

      <h1 class="title">Gabrielle Essence Eau De Parfum</h1>

      <p class="desc">
        A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.
      </p>

      <div class="price-group">
        <h1 class="price">$149.99</h1>
        <p class="discount">$169.99</p>
      </div>

      <button class="cart-btn" type="button">
        <img src="icon-cart.svg" alt="" class="cart-icon">
        <span>Add to Cart</span>
      </button>

    </div>
  </main>
</body>
</html>
